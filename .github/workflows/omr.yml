# .github/workflows/omr.yml
# Reads one photo of sheet music with up to three engines in parallel:
#   audiveris - classic optical music recognition, best on clean scans
#   homr      - neural network made for camera photos
#   oemer     - neural network, end-to-end
# Each engine saves jobs/<id>/<engine>.<mxl|musicxml>.bin (encrypted) or
# jobs/<id>/<engine>.err.txt. Started by the sheet-omr Worker.
name: OMR

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id (set by the Worker)"
        required: true
      engines:
        description: "Comma-separated engines"
        required: false
        default: "audiveris,homr,oemer"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      engines: ${{ steps.e.outputs.list }}
    env:
      JOB_ID: ${{ inputs.job_id }}
      ENGINES: ${{ inputs.engines }}
    steps:
      - id: e
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "Bad job id"; exit 1; }
          list=""
          for e in ${ENGINES//,/ }; do
            case "$e" in audiveris|homr|oemer) list="$list,\"$e\"";; esac
          done
          [ -n "$list" ] || list=',"audiveris"'
          echo "list=[${list#,}]" >> "$GITHUB_OUTPUT"
          echo "Engines: [${list#,}]"

  read:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
    env:
      JOB_ID: ${{ inputs.job_id }}
      ENGINE: ${{ matrix.engine }}
      OMR_KEY: ${{ secrets.OMR_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            jobs/${{ inputs.job_id }}
          sparse-checkout-cone-mode: false

      - name: Unlock the photo
        run: |
          mkdir -p work out
          cat > work/seal.py <<'PY'
          # AES-256-GCM, stored as 12-byte nonce + ciphertext/tag (matches the Worker)
          import base64, os, sys
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          aes = AESGCM(base64.b64decode(os.environ["OMR_KEY"]))
          mode, src, dst = sys.argv[1:4]
          data = open(src, "rb").read()
          if mode == "dec":
              out = aes.decrypt(data[:12], data[12:], None)
          else:
              n = os.urandom(12)
              out = n + aes.encrypt(n, data, None)
          open(dst, "wb").write(out)
          PY
          /usr/bin/python3 -c "import cryptography" 2>/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq python3-cryptography; }
          d="jobs/$JOB_ID"
          if [ ! -f "$d/input.bin" ]; then echo "READER: The photo didn't arrive." > "$d/$ENGINE.err.txt"; exit 0; fi
          /usr/bin/python3 work/seal.py dec "$d/input.bin" work/input.jpg || { echo "READER: The photo couldn't be unlocked (OMR_KEY mismatch)." > "$d/$ENGINE.err.txt"; exit 0; }
          echo "Photo: $(stat -c %s work/input.jpg) bytes"

      # ------------------------------------------------------------ Audiveris
      - name: Find latest Audiveris release
        if: matrix.engine == 'audiveris'
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh api repos/Audiveris/audiveris/releases/latest)
          tag=$(echo "$json" | jq -r .tag_name)
          url=$(echo "$json" | jq -r '[.assets[] | select(.name | test("ubuntu.*24\\.04.*\\.deb$"; "i"))][0].browser_download_url // empty')
          [ -n "$url" ] || url=$(echo "$json" | jq -r '[.assets[] | select(.name | test("\\.deb$"; "i"))][0].browser_download_url // empty')
          [ -n "$url" ] || { echo "No Linux .deb in Audiveris $tag"; exit 1; }
          echo "Audiveris $tag -> $url"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Cache Audiveris installer
        if: matrix.engine == 'audiveris'
        uses: actions/cache@v4
        with:
          path: ~/audiveris.deb
          key: audiveris-deb-${{ steps.rel.outputs.tag }}

      - name: Install Audiveris
        if: matrix.engine == 'audiveris'
        run: |
          [ -s ~/audiveris.deb ] || curl -fsSL -o ~/audiveris.deb "${{ steps.rel.outputs.url }}"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq imagemagick xvfb libasound2t64
          # The installer's last step adds a desktop menu icon, which fails on a
          # server with no desktop; if so, unpack the program files directly.
          sudo mkdir -p /etc/xdg/menus /usr/share/desktop-directories /usr/share/applications /usr/share/icons/hicolor
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "$HOME/audiveris.deb"; then
            echo "Package setup step failed - unpacking the program files directly"
            sudo dpkg-deb -x "$HOME/audiveris.deb" /
          fi
          [ -x /opt/audiveris/bin/Audiveris ] || { echo "Audiveris executable not found"; exit 1; }

      - name: Read with Audiveris
        if: matrix.engine == 'audiveris'
        run: |
          d="jobs/$JOB_ID"
          [ -f work/input.jpg ] || exit 0
          # upright, grey, straightened, big enough; plus a black-and-white version
          convert work/input.jpg -auto-orient -colorspace Gray -deskew 40% +repage \
                  -resize '3000x3000<' -normalize work/gray.png
          convert work/gray.png -lat 60x60-8% work/bw.png
          run_aud () {
            rm -rf out/*
            timeout 300 xvfb-run -a /opt/audiveris/bin/Audiveris -batch -export -output out "$1" >> work/log.txt 2>&1 || true
            find out -name '*.mxl' | sort | head -1
          }
          m=""
          for f in work/bw.png work/gray.png work/input.jpg; do
            echo "=== $f" >> work/log.txt
            m=$(run_aud "$f")
            [ -n "$m" ] && break
          done
          if [ -n "$m" ]; then
            /usr/bin/python3 work/seal.py enc "$m" "$d/audiveris.mxl.bin"
          elif grep -qiE 'too low|resolution|interline' work/log.txt; then
            echo "READER: Staff lines too small or blurry - move closer so the staves fill the frame." > "$d/audiveris.err.txt"
          else
            echo "READER: No music recognized." > "$d/audiveris.err.txt"
          fi
          tail -n 40 work/log.txt

      # ----------------------------------------------------------------- homr
      - uses: actions/setup-python@v5
        if: matrix.engine == 'homr' || matrix.engine == 'oemer'
        with:
          python-version: "3.11"

      - name: Cache homr (program and models)
        if: matrix.engine == 'homr'
        uses: actions/cache@v4
        with:
          path: ~/venv-homr
          key: venv-homr-0.7.1-py311-v2

      - name: Install homr
        if: matrix.engine == 'homr'
        run: |
          if [ ! -x ~/venv-homr/bin/homr ]; then
            python -m venv ~/venv-homr
            ~/venv-homr/bin/pip install -q --upgrade pip
            ~/venv-homr/bin/pip install -q "homr[cpu]==0.7.1"
          fi
          ~/venv-homr/bin/homr --init --no-title > work/homr-init.log 2>&1 || { tail -n 30 work/homr-init.log; exit 1; }
          echo "homr ready"

      - name: Read with homr
        if: matrix.engine == 'homr'
        run: |
          d="jobs/$JOB_ID"
          [ -f work/input.jpg ] || exit 0
          timeout 900 ~/venv-homr/bin/homr --no-title work/input.jpg > work/homr.log 2>&1 || true
          tail -n 40 work/homr.log
          if [ -s work/input.musicxml ]; then
            /usr/bin/python3 work/seal.py enc work/input.musicxml "$d/homr.musicxml.bin"
          else
            why=$(grep -E "Error|Exception|error:" work/homr.log | tail -1 | cut -c1-200)
            echo "READER: No music recognized.${why:+ ($why)}" > "$d/homr.err.txt"
          fi

      # ---------------------------------------------------------------- oemer
      - name: Cache oemer (program and models)
        if: matrix.engine == 'oemer'
        uses: actions/cache@v4
        with:
          path: ~/venv-oemer
          key: venv-oemer-0.1.8-py311-cpu-v2

      - name: Install oemer
        if: matrix.engine == 'oemer'
        run: |
          if [ ! -x ~/venv-oemer/bin/oemer ]; then
            python -m venv ~/venv-oemer
            ~/venv-oemer/bin/pip install -q --upgrade pip
            ~/venv-oemer/bin/pip install -q "oemer==0.1.8" "numpy<2"
            # GitHub's servers have no graphics card: swap in the plain CPU runtime
            ~/venv-oemer/bin/pip uninstall -q -y onnxruntime-gpu || true
            ~/venv-oemer/bin/pip install -q onnxruntime "numpy<2"
          fi
          pkg=$(~/venv-oemer/bin/python -c "import oemer, os; print(os.path.dirname(oemer.__file__))")
          base=https://github.com/BreezeWhite/oemer/releases/download/checkpoints
          mkdir -p "$pkg/checkpoints/unet_big" "$pkg/checkpoints/seg_net"
          get () { [ -s "$2" ] || curl -fsSL -o "$2" "$base/$1"; }
          get 1st_model.onnx   "$pkg/checkpoints/unet_big/model.onnx"
          get 1st_weights.h5   "$pkg/checkpoints/unet_big/weights.h5"
          get 2nd_model.onnx   "$pkg/checkpoints/seg_net/model.onnx"
          get 2nd_weights.h5   "$pkg/checkpoints/seg_net/weights.h5"
          ls -la "$pkg/checkpoints/unet_big" "$pkg/checkpoints/seg_net"
          ~/venv-oemer/bin/python -c "import onnxruntime as o; print('onnxruntime', o.__version__, o.get_available_providers())"

      - name: Read with oemer
        if: matrix.engine == 'oemer'
        run: |
          d="jobs/$JOB_ID"
          [ -f work/input.jpg ] || exit 0
          mkdir -p work/oemer
          timeout 1200 ~/venv-oemer/bin/oemer work/input.jpg -o work/oemer/ > work/oemer.log 2>&1 || true
          tr '\r' '\n' < work/oemer.log | grep -v -E "[0-9.]+% [0-9]+/" | tail -n 60
          m=$(ls work/oemer/*.musicxml 2>/dev/null | head -1)
          if [ -n "$m" ] && [ -s "$m" ]; then
            /usr/bin/python3 work/seal.py enc "$m" "$d/oemer.musicxml.bin"
          else
            why=$(tr '\r' '\n' < work/oemer.log | grep -E "Error|Exception" | tail -1 | cut -c1-200)
            echo "READER: No music recognized.${why:+ ($why)}" > "$d/oemer.err.txt"
          fi

      # ------------------------------------------------------------- results
      - name: Report failure
        if: failure()
        run: |
          mkdir -p "jobs/$JOB_ID"
          [ -f "jobs/$JOB_ID/$ENGINE.mxl.bin" ] || [ -f "jobs/$JOB_ID/$ENGINE.musicxml.bin" ] || \
            echo "READER: This engine crashed - please try again." > "jobs/$JOB_ID/$ENGINE.err.txt"

      - name: Save result
        if: always()
        run: |
          git config user.name "sheet-omr"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "jobs/$JOB_ID"
          git commit -q -m "OMR $ENGINE result $JOB_ID" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          exit 1
